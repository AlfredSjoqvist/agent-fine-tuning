interaction:
  - name: "babyai"
    class_name: "babyai_rl.babyai_interaction.BabyAIInteraction"
    config:
      default_game_name: "BabyAI-GoToLocal-v0"
      max_turns: 30
      max_episode_steps: 50
      # L_shuffled (intervention): the admissible-actions list IS shown every
      # turn, but its order is randomly permuted each turn. Same information
      # content as L_per_step but no stable positional encoding for the policy
      # to learn shortcuts on.
      show_action_list_per_turn: True
      shuffle_list_per_turn: True
