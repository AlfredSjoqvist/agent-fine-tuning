interaction:
  - name: "babyai"
    class_name: "babyai_rl.babyai_interaction.BabyAIInteraction"
    config:
      default_game_name: "BabyAI-GoToLocal-v0"
      max_turns: 30
      max_episode_steps: 50
      # L_init: admissible list is shown once at turn 0 (via the parquet's
      # initial user message), never again per-turn. block_check_available
      # prevents the LLM from using "check available actions" to recover the
      # list on demand, which would collapse this condition into L_per_step.
      show_action_list_per_turn: False
      block_check_available: True
