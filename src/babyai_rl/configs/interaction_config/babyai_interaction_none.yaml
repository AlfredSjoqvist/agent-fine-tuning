interaction:
  - name: "babyai"
    class_name: "babyai_rl.babyai_interaction.BabyAIInteraction"
    config:
      default_game_name: "BabyAI-GoToRedBall-v0"
      max_turns: 30
      max_episode_steps: 50
      # L_none ablation arm: never re-emit the action list. The initial user
      # message in the parquet also omits it (see prepare_babyai_data.py).
      # Schema-level affordance info ("you can do <go to>, <pick up>, ...")
      # is still in the system prompt, identical to per_step condition. The
      # only varied feature: per-instance list with concrete object IDs.
      show_action_list_per_turn: False
